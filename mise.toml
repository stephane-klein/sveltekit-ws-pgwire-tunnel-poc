[settings]
experimental = true

[deps.pnpm]
auto = true

[env]
_.source = [
  { path = '.envrc', cacheable = false },
  { path = 'scripts/load_postgres_variables.sh', tools = true, cacheable = false },
]

[tools]
node = "24.21.0"
pnpm = "12.11.2"
websocat = "1.14.1"
"conda:postgresql" = "18.4" # to install PostgreSQL clients: psql, pg_dump, etc


[shell_alias]
reload = "source scripts/load_postgres_variables.sh"

[tasks.enter-in-pg]
run = "psql \"${MY_APP_POSTGRES_URL}\""

[tasks.load-sql]
description = "Load a SQL file into the PostgreSQL database"
usage = 'arg "<file>" help="Path to the SQL file to execute"'
run = './scripts/load_sql.sh "${usage_file}"'

[tasks.make-token]
description = "Generate a session JWT for an application user"
usage = 'arg "<sub>" help="Application user id"'
run = 'node scripts/make_token.js "${usage_sub}"'

[tasks.query-contacts]
description = "Run select * from contacts through the WebSocket tunnel"
usage = 'arg "<sub>" help="Application user id"'
run = 'export PG_SESSION_TOKEN="$(node scripts/make_token.js "${usage_sub}")" && node src/cli/query_contacts.js'

[tasks.websocat]
description = "Run the websocat bridge for the PostgreSQL tunnel"
run = './scripts/websocat.sh'

[tasks.psql-tunnel]
description = "Open a psql REPL through the websocat tunnel"
run = './scripts/psql_tunnel.sh'
